name: portfolio
description: "Dmitry Sevryukov — developer portfolio. Flutter, web only."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies are deliberately few. Anything added here has to earn its place
# against simply writing the thing, and it costs download size on a site whose
# job is to load fast for a stranger who may leave.
dependencies:
  flutter:
    sdk: flutter

  # Part of the SDK, not a third-party package: it carries the URL strategy, so
  # addresses are /work rather than /#/work. go_router used to re-export this
  # and no longer does.
  flutter_web_plugins:
    sdk: flutter

  # The one exception, and it earns it: this is a *website*, so /work/<project>
  # has to be a real URL that can be pasted into a CV, survive a refresh, and
  # work with the back button. Hand-rolling Navigator 2.0 on web is genuinely
  # unpleasant for no payoff anyone can see.
  go_router: ^17.4.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Stricter than flutter_lints: catches unused code, missing return types, and
  # unsafe patterns the default set lets through.
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  # ── Two faces, both VARIABLE, both bundled ────────────────────────────────
  #
  # Bundled rather than fetched: a runtime font request is a second origin on
  # the critical path, and cross-origin isolation would block it anyway.
  #
  # LORA is the display face. Chosen on a real phone against the real scene,
  # after Archivo, Cinzel, Playfair, Marcellus, Forum and Cormorant were each
  # built and looked at — twice over, because the ones that won as still images
  # in Figma lost the moment the energy was moving behind them.
  #
  # ⚠️ IT WAS CHOSEN FOR THE MECHANISM, and that is the part worth keeping.
  # The statement is rasterised into a mask and a shader fills it PER PIXEL, so
  # a stroke only shows the energy travelling through it if the stroke is wide
  # enough to hold more than one sample of the field. Measured across the whole
  # shortlist, Lora puts the most ink on the page — 0.102em thick strokes
  # against Cinzel's 0.075 — and its thinnest stroke is 6.4 device pixels on a
  # phone against Playfair's 3.6. A hairline takes one colour and reads as
  # tinted; a fat stroke shows the flow.
  #
  # It is also the only CONTEMPORARY face on that list — not a revival of a
  # historical model — so it carries no period with it. That is deliberate: the
  # ancient half of the concept belongs to the cube, not to the sentence, which
  # has to stay credible as an engineering claim.
  #
  # Weight axis only, 400-600. No width axis and no optical size, so the
  # statement is fitted by size alone — see hero_panel.dart.
  #
  # INTER is the UI face, chosen for the OPTICAL SIZE axis: the typeface itself
  # tightens spacing and refines detail as the size grows, instead of a
  # hand-guessed tracking curve doing it badly.
  #
  # ⚠️ SUBSET AND AXIS-TRIMMED, and it has to stay that way. Raw they are
  # 1.5MB; cut to Latin plus the two marks this site actually uses (· and →)
  # and with the unused ends of the axes removed, they are 114KB gzipped
  # together. Replacing either file with a full download would quietly put a
  # megabyte back on first paint.
  fonts:
    - family: Lora
      fonts:
        - asset: fonts/Lora-display.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter-ui.ttf

  # Fragment shaders are core Flutter — no package, no asset payload beyond the
  # compiled program itself.
  shaders:
    - shaders/scene.frag
    # The light the statement throws off. Runs on a layer above the text and
    # only ever adds — the type is drawn by Flutter, untouched.
    - shaders/type_glow.frag
