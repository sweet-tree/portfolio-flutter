name: portfolio
description: "Dmitry Sevryukov — developer portfolio. Flutter, web only."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies are deliberately few. Anything added here has to earn its place
# against simply writing the thing, and it costs download size on a site whose
# job is to load fast for a stranger who may leave.
dependencies:
  flutter:
    sdk: flutter

  # The one exception, and it earns it: this is a *website*, so /work/<project>
  # has to be a real URL that can be pasted into a CV, survive a refresh, and
  # work with the back button. Hand-rolling Navigator 2.0 on web is genuinely
  # unpleasant for no payoff anyone can see.
  go_router: ^17.4.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Stricter than flutter_lints: catches unused code, missing return types, and
  # unsafe patterns the default set lets through.
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  # ── Two faces, both VARIABLE, both bundled ────────────────────────────────
  #
  # Bundled rather than fetched: a runtime font request is a second origin on
  # the critical path, and cross-origin isolation would block it anyway.
  #
  # ARCHIVO is the display face. A UI text face like Roboto is drawn to hold
  # up at 14px; at 150px its shapes are generic and its spacing collapses the
  # moment any tracking is applied — which is exactly the "Sy" collision that
  # sent us looking. Archivo carries a WIDTH axis as well as weight, so a line
  # can be fitted to the measure by adjusting its width instead of its size,
  # which is how flush setting is actually done.
  #
  # INTER is the UI face, chosen for the OPTICAL SIZE axis: the typeface itself
  # tightens spacing and refines detail as the size grows, instead of a
  # hand-guessed tracking curve doing it badly.
  #
  # ⚠️ SUBSET AND AXIS-TRIMMED, and it has to stay that way. Raw they are
  # 1.5MB; cut to Latin plus the two marks this site actually uses (· and →)
  # and with the unused ends of the axes removed, they are 168KB gzipped
  # together. Replacing either file with a full download would quietly put a
  # megabyte back on first paint.
  fonts:
    - family: Archivo
      fonts:
        - asset: fonts/Archivo-display.ttf
    - family: Inter
      fonts:
        - asset: fonts/Inter-ui.ttf

  # Fragment shaders are core Flutter — no package, no asset payload beyond the
  # compiled program itself.
  shaders:
    - shaders/scene.frag
    # The light the statement throws off. Runs on a layer above the text and
    # only ever adds — the type is drawn by Flutter, untouched.
    - shaders/type_glow.frag
